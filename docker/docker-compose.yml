version: '3.8'

services:
  autoppt-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: autoppt-backend
    ports:
      - "8000:8000"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - DEBUG=${DEBUG:-true}
      - OUTPUT_DIR=/app/output
    volumes:
      - autoppt-data:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  autoppt-data:
    driver: local
